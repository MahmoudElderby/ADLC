services:
  postgres:
    image: postgres:17-alpine
    container_name: adlc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adlc
      POSTGRES_USER: adlc
      POSTGRES_PASSWORD: adlc_dev_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adlc -d adlc"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db

  mcp-connector-reachable:
    image: node:24-alpine
    container_name: adlc-mcp-connector-reachable
    working_dir: /app
    volumes:
      - ./packages/test-support/src/test-mcp-server.ts:/app/test-mcp-server.ts:ro
    command:
      - node
      - --experimental-strip-types
      - test-mcp-server.ts
      - --mode=tools
      - --port=8080
      - --host=0.0.0.0
      - --tools=search
    expose:
      - "8080"
    ports:
      - "18080:8080"
    networks:
      connector-only: {}
      host-published: {}

  mcp-api-reachable:
    image: node:24-alpine
    container_name: adlc-mcp-api-reachable
    working_dir: /app
    volumes:
      - ./packages/test-support/src/test-mcp-server.ts:/app/test-mcp-server.ts:ro
    command:
      - node
      - --experimental-strip-types
      - test-mcp-server.ts
      - --mode=tools
      - --port=8080
      - --host=0.0.0.0
      - --tools=search
    expose:
      - "8080"
    ports:
      - "18081:8080"
    networks:
      api-only: {}
      host-published: {}

  mcp-no-tools:
    image: node:24-alpine
    container_name: adlc-mcp-no-tools
    working_dir: /app
    volumes:
      - ./packages/test-support/src/test-mcp-server.ts:/app/test-mcp-server.ts:ro
    command:
      - node
      - --experimental-strip-types
      - test-mcp-server.ts
      - --mode=none
      - --port=8080
      - --host=0.0.0.0
    expose:
      - "8080"
    ports:
      - "18082:8080"
    networks:
      connector-only: {}
      host-published: {}

networks:
  db:
  api-only:
    internal: true
  connector-only:
    internal: true
  host-published:

volumes:
  postgres-data:
