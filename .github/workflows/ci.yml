name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: adlc
          POSTGRES_USER: adlc
          POSTGRES_PASSWORD: adlc_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adlc -d adlc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://adlc:adlc_dev_password@localhost:5432/adlc
      TEST_DATABASE_URL: postgres://adlc:adlc_dev_password@localhost:5432/adlc
      OPENAI_API_KEY: test-openai-key
      SECRET_ENCRYPTION_KEY: ci-secret-encryption-key-32-bytes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:openapi
      - run: pnpm db:migrate
      - run: pnpm ci
